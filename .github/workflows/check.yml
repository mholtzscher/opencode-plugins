name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install_args: bun node
      - run: bun install --frozen-lockfile
      - run: bun run check

  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - cache-metrics
          - classify
          - marketplace
          - quota-usage
          - workflow-tools
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install_args: bun node
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        if: matrix.path != 'marketplace'
