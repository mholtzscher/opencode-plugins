name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      classify_tag:
        description: Existing Classify release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      classify_released: ${{ steps.release.outputs['classify--release_created'] }}
      classify_tag: ${{ steps.release.outputs['classify--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN-created releases do not trigger another workflow. Publish in
  # this run, as in pi-extensions. Only Classify opts into npm publishing.
  publish-classify:
    needs: release
    if: >-
      always() && (needs.release.outputs.classify_released == 'true' ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.classify_tag, 'classify-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: classify
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.classify_tag || inputs.classify_tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.classify_tag || inputs.classify_tag }}
        run: |
          test "$RELEASE_TAG" = "classify-v$(node -p 'require("./package.json").version')"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false

      # npm trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run

      # Configure release-please.yml as this package's npm trusted publisher.
      # npm uses GitHub OIDC and generates provenance without NODE_AUTH_TOKEN.
      - run: npm publish --access public --loglevel verbose
