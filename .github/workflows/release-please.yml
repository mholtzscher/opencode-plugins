name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      classify_tag:
        description: Existing Classify release tag to publish
        required: false
        type: string
      workflow_tools_tag:
        description: Existing Workflow tools release tag to publish
        required: false
        type: string
      quota_usage_tag:
        description: Existing Quota usage release tag to publish
        required: false
        type: string
      cache_metrics_tag:
        description: Existing Cache metrics release tag to publish
        required: false
        type: string
      tab_shortcuts_tag:
        description: Existing Tab shortcuts release tag to publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      classify_released: ${{ steps.release.outputs['classify--release_created'] }}
      classify_tag: ${{ steps.release.outputs['classify--tag_name'] }}
      workflow_tools_released: ${{ steps.release.outputs['workflow-tools--release_created'] }}
      workflow_tools_tag: ${{ steps.release.outputs['workflow-tools--tag_name'] }}
      quota_usage_released: ${{ steps.release.outputs['quota-usage--release_created'] }}
      quota_usage_tag: ${{ steps.release.outputs['quota-usage--tag_name'] }}
      cache_metrics_released: ${{ steps.release.outputs['cache-metrics--release_created'] }}
      cache_metrics_tag: ${{ steps.release.outputs['cache-metrics--tag_name'] }}
      tab_shortcuts_released: ${{ steps.release.outputs['tab-shortcuts--release_created'] }}
      tab_shortcuts_tag: ${{ steps.release.outputs['tab-shortcuts--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN-created releases do not trigger another workflow. Publish in
  # this run, as in pi-extensions. All plugins opt into npm.
  publish-classify:
    needs: release
    if: >-
      always() && (needs.release.outputs.classify_released == 'true' ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.classify_tag, 'classify-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: classify
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.classify_tag || inputs.classify_tag }}

      # Use the workflow's environment pins, including when recovering older tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-env
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use workflow environment
        working-directory: ${{ github.workspace }}
        run: cp .ci-env/mise.toml mise.toml

      - uses: jdx/mise-action@v3
        with:
          install_args: bun node

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.classify_tag || inputs.classify_tag }}
        run: |
          test "$RELEASE_TAG" = "classify-v$(node -p 'require("./package.json").version')"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false

      # The pinned Node runtime bundles npm >= 11.5.1 for trusted publishing.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run

      # Configure release-please.yml as this package's npm trusted publisher.
      # npm uses GitHub OIDC and generates provenance without NODE_AUTH_TOKEN.
      - run: npm publish --registry https://registry.npmjs.org --access public --loglevel verbose

  publish-workflow-tools:
    needs: release
    if: >-
      always() && (needs.release.outputs.workflow_tools_released == 'true' ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.workflow_tools_tag, 'workflow-tools-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: workflow-tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.workflow_tools_tag || inputs.workflow_tools_tag }}

      # Use the workflow's environment pins, including when recovering older tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-env
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use workflow environment
        working-directory: ${{ github.workspace }}
        run: cp .ci-env/mise.toml mise.toml

      - uses: jdx/mise-action@v3
        with:
          install_args: bun node

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.workflow_tools_tag || inputs.workflow_tools_tag }}
        run: |
          test "$RELEASE_TAG" = "workflow-tools-v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").name')" = "@mholtzscher/opencode-workflow-tools"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false

      # The pinned Node runtime bundles npm >= 11.5.1 for trusted publishing.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run

      # Configure release-please.yml as this package's npm trusted publisher.
      - run: npm publish --registry https://registry.npmjs.org --access public --loglevel verbose

  publish-cache-metrics:
    needs: release
    if: >-
      always() && (needs.release.outputs.cache_metrics_released == 'true' ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.cache_metrics_tag, 'cache-metrics-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cache-metrics
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.cache_metrics_tag || inputs.cache_metrics_tag }}

      # Use the workflow's environment pins, including when recovering older tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-env
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use workflow environment
        working-directory: ${{ github.workspace }}
        run: cp .ci-env/mise.toml mise.toml

      - uses: jdx/mise-action@v3
        with:
          install_args: bun node

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.cache_metrics_tag || inputs.cache_metrics_tag }}
        run: |
          test "$RELEASE_TAG" = "cache-metrics-v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").name')" = "@mholtzscher/opencode-cache-metrics"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false

      # Verify the committed bundle before rebuilding the npm artifact.
      - run: bun install --frozen-lockfile
      - run: bun run build.ts --check
      - run: bun run build:tui
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run

      # Configure release-please.yml as this package's npm trusted publisher.
      - run: npm publish --registry https://registry.npmjs.org --access public --loglevel verbose

  publish-quota-usage:
    needs: release
    if: >-
      always() && (needs.release.outputs.quota_usage_released == 'true' ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.quota_usage_tag, 'quota-usage-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: quota-usage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.quota_usage_tag || inputs.quota_usage_tag }}

      # Use the workflow's environment pins, including when recovering older tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-env
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use workflow environment
        working-directory: ${{ github.workspace }}
        run: cp .ci-env/mise.toml mise.toml

      - uses: jdx/mise-action@v3
        with:
          install_args: bun node

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.quota_usage_tag || inputs.quota_usage_tag }}
        run: |
          test "$RELEASE_TAG" = "quota-usage-v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").name')" = "@mholtzscher/opencode-quota-usage"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false

      # The pinned Node runtime bundles npm >= 11.5.1 for trusted publishing.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run

      # Configure release-please.yml as this package's npm trusted publisher.
      - run: npm publish --registry https://registry.npmjs.org --access public --loglevel verbose

  publish-tab-shortcuts:
    needs: release
    if: >-
      always() && (needs.release.outputs.tab_shortcuts_released == 'true' ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.tab_shortcuts_tag, 'tab-shortcuts-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tab-shortcuts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tab_shortcuts_tag || inputs.tab_shortcuts_tag }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-env
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use workflow environment
        working-directory: ${{ github.workspace }}
        run: cp .ci-env/mise.toml mise.toml
      - uses: jdx/mise-action@v3
        with:
          install_args: bun node
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tab_shortcuts_tag || inputs.tab_shortcuts_tag }}
        run: |
          test "$RELEASE_TAG" = "tab-shortcuts-v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").name')" = "@mholtzscher/opencode-tab-shortcuts"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run
      - run: npm publish --registry https://registry.npmjs.org --access public --loglevel verbose
